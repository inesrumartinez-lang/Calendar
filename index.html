<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📅</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f5ef;--card:#fff;--border:#e8e2d6;--ink:#2b2722;--muted:#8a8175;--radius:12px;--ff:'Spline Sans',sans-serif;--fd:'Fraunces',serif}
*{box-sizing:border-box;margin:0}body{font-family:var(--ff);background:var(--bg);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--ff)}input,select,textarea{font-family:var(--ff)}
#app{max-width:740px;margin:0 auto;padding:16px 14px 60px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.hdr h1{font-family:var(--fd);font-size:28px;font-weight:700;letter-spacing:-.02em}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--card);padding:9px 14px;border-radius:var(--radius);transition:background .15s}
.btn:hover{background:#f0ece3}.btn-dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn-dark:hover{background:#444}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nav-btn{font-family:var(--fd);font-size:22px;width:38px;height:38px;border:1px solid var(--border);background:var(--card);border-radius:var(--radius);display:flex;align-items:center;justify-content:center}
.month-lbl{font-family:var(--fd);font-size:22px;font-weight:700;min-width:140px}.month-lbl span{opacity:.45;font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted)}
.leg-item{display:inline-flex;align-items:center;gap:5px}
.swatch{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}.leg-count{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:2px 0 6px}
.cell{aspect-ratio:1;border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:6px 7px;transition:filter .12s;background:var(--card);position:relative}
.cell:hover{filter:brightness(.96)}.cell.today{border-color:var(--ink);border-width:2px}
.day-num{font-size:15px;font-weight:500}.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;width:100%}.ev-dot{width:6px;height:6px;border-radius:50%}
.overlay{position:fixed;inset:0;background:rgba(30,26,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:580px;border-radius:20px 20px 0 0;padding:20px 18px 28px;box-shadow:0 -8px 40px rgba(0,0,0,.2);max-height:85vh;overflow-y:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-title{font-family:var(--fd);font-size:20px;font-weight:700}
.close{font-size:26px;border:none;background:none;color:var(--muted);line-height:1}
.place-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.place-btn{font-size:13px;font-weight:600;border:2px solid transparent;padding:9px 14px;border-radius:var(--radius);transition:all .12s}
.place-btn.active{color:#fff}
.clear-btn{font-size:12px;color:var(--muted);border:1px solid var(--border);background:var(--card);padding:8px 12px;border-radius:var(--radius)}
.ev-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.ev-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--radius);padding:9px 12px;border-left:4px solid #ccc}
.ev-time{font-size:12px;color:var(--muted);width:42px;font-variant-numeric:tabular-nums}.ev-name{font-size:14px;flex:1}
.ev-del{font-size:12px;color:#c0392b;border:none;background:none}.ev-edit{font-size:12px;color:#2980b9;border:none;background:none;margin-right:4px}
.empty{font-size:13px;color:var(--muted)}
.add-row{display:flex;gap:6px}.add-row input[type=text]{flex:1;font-size:14px;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;background:var(--card)}
.add-row input[type=time]{font-size:14px;border:1px solid var(--border);border-radius:var(--radius);padding:10px;background:var(--card);width:100px}
.add-row select{font-size:13px;border:1px solid var(--border);border-radius:var(--radius);padding:10px;background:var(--card)}.add-row .btn-dark{white-space:nowrap}
.edit-row{display:flex;gap:6px;margin-bottom:7px;align-items:center}
.edit-row input,.edit-row select{font-size:13px;border:1px solid var(--border);border-radius:8px;padding:7px 8px;background:var(--card)}
.loc-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.loc-item .swatch{width:28px;height:28px;border-radius:8px;cursor:pointer;flex-shrink:0}
.loc-item input[type=text]{font-size:14px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;flex:1;min-width:0}
.add-loc-row{display:flex;gap:6px;margin-top:10px}
.color-picker{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:60;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.color-opt{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}.color-opt:hover,.color-opt.sel{border-color:var(--ink)}
.color-custom-row{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin-top:2px}
.color-custom-row input{width:36px;height:30px;border:none;padding:0;cursor:pointer;border-radius:6px}.color-custom-row span{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:11px 18px;border-radius:var(--radius);z-index:70;max-width:360px;text-align:center;animation:fadeIn .2s}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}
.req-badge{display:inline-flex;align-items:center;justify-content:center;background:#e74c3c;color:#fff;font-size:10px;font-weight:700;width:20px;height:20px;border-radius:50%;margin-left:6px;vertical-align:middle}
.req-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.req-dates{font-family:var(--fd);font-size:16px;font-weight:600;margin-bottom:4px}
.req-note{font-size:13px;color:var(--muted);margin-bottom:10px}
.req-status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:8px}
.req-actions{display:flex;gap:8px}
.btn-accept{font-size:12px;font-weight:600;border:none;background:#27ae60;color:#fff;padding:7px 14px;border-radius:8px}
.btn-reject{font-size:12px;font-weight:600;border:none;background:#e74c3c;color:#fff;padding:7px 14px;border-radius:8px}
.btn-dismiss{font-size:12px;color:var(--muted);border:1px solid var(--border);background:var(--card);padding:7px 14px;border-radius:8px}
.req-form-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.req-form-row label{font-size:13px;font-weight:600;min-width:50px}
.req-form-row input{font-size:14px;border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--card);flex:1}
.req-form-row textarea{font-family:var(--ff);font-size:14px;border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--card);flex:1;resize:vertical;min-height:60px}
.btn-request{background:linear-gradient(135deg,#f0b6c5,#c8b8e8);color:var(--ink);border:none;font-weight:600;font-size:13px;padding:9px 14px;border-radius:var(--radius)}.btn-request:hover{filter:brightness(.95)}
.banner{display:flex;align-items:center;gap:10px;border-radius:var(--radius);padding:12px 16px;margin-bottom:10px;cursor:pointer;font-size:14px;transition:filter .15s;animation:slideDown .3s ease}
.banner:hover{filter:brightness(.96)}.banner-icon{font-size:18px}.banner-arrow{margin-left:auto;font-size:16px;opacity:.5}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.poll-opt{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:5px;font-size:14px;display:flex;align-items:center;gap:8px}
.poll-rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;flex-shrink:0}
.vote-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.vote-arrow{width:32px;height:32px;border:1px solid var(--border);background:var(--card);border-radius:8px;font-size:14px;display:flex;align-items:center;justify-content:center}
.vote-arrow:disabled{opacity:.25;cursor:default}
.opt-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.leg-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.saving{position:fixed;top:12px;right:12px;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 14px;border-radius:20px;z-index:80;animation:fadeIn .15s}
.refresh-btn{font-size:16px;width:38px;height:38px;border:1px solid var(--border);background:var(--card);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;transition:transform .3s}
.refresh-btn:hover{transform:rotate(180deg)}
.mini-wrap{display:flex;gap:12px;margin-top:16px;overflow-x:auto;padding-bottom:8px}
.mini-cal{flex:0 0 auto;width:220px}
.mini-cal h4{font-family:var(--fd);font-size:14px;margin-bottom:6px;font-weight:600}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini-dow{text-align:center;font-size:9px;color:var(--muted);padding:1px 0 3px}
.mini-cell{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:1px solid transparent;position:relative}
.mini-cell:hover{border-color:var(--border)}.mini-cell.today{font-weight:700;border-color:var(--ink)}
.multi-toggle{font-size:12px;color:var(--muted);border:1px solid var(--border);background:var(--card);padding:6px 10px;border-radius:8px}
.cell.split{background:linear-gradient(to bottom,var(--c1) 50%,var(--c2) 50%)}
.mini-cell.split{background:linear-gradient(to bottom,var(--c1) 50%,var(--c2) 50%);border:none}
.cell-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;opacity:0.8;pointer-events:none}
.mini-cell .cell-icon{font-size:10px}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando calendario...</div></div>
<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxuzvoTE0NmXb-Y7fXlOc1HfnTo-IbMuPelKt5RYA0_eN1nKmICK9n_93ZeIczj0mV9Ew/exec',
};
const PASTELS = ['#a7d8c8','#f5c6a0','#b8d4e8','#f0b6c5','#c8b8e8','#d6e8a0','#fde2a7','#a7cfe8','#e8c8d6','#b8e8c0','#e8d0a7','#a7e8d8'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DOW = ['L','M','X','J','V','S','D'];
const DAYS_ES = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];

const isEditor = new URLSearchParams(location.search).get('modo') === 'editor';
let state = {
  locations:[],days:{},events:[],requests:[],polls:[],
  cursor: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  selected:null, showLocMgr:false, showRequests:false, showRequestForm:false,
  showPolls:false, showPollForm:false,
  pollOptions:[{legs:[{from:'',to:'',loc:''}]}],
  votingPoll:null, voteOrder:[],
  colorPicker:null, toast:'', saving:false,
  editingEvent:null, multiMonth:false, acceptingRequest:null,
  showRangeMark:false, rangeLoc:'', rangeReplace:false, lastError:null,
  showDebug:false, debugOutput:''
};

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = iso(new Date());
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $ = sel => document.querySelector(sel);
// Normaliza una fecha que puede venir como "2026-05-29" o como "Fri May 29 2026 09:00:00 GMT+0200..." (bug Apps Script)
function normalizeDateStr(s){
  if(!s)return '';
  const str=String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(str))return str.slice(0,10);
  const d=new Date(str);
  if(!isNaN(d.getTime()))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return str;
}
function darken(hex,amt=0.4){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `#${Math.round(r*(1-amt)).toString(16).padStart(2,'0')}${Math.round(g*(1-amt)).toString(16).padStart(2,'0')}${Math.round(b*(1-amt)).toString(16).padStart(2,'0')}`;}
function parseISO(s){if(!s)return null;const str=String(s).trim();let m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m){const y=+m[1],mo=+m[2],d=+m[3];if(mo>=1&&mo<=12&&d>=1&&d<=31)return{y,m:mo,d};}m=str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(m){const d=+m[1],mo=+m[2],y=+m[3];if(mo>=1&&mo<=12&&d>=1&&d<=31)return{y,m:mo,d};}const dt=new Date(str);if(!isNaN(dt.getTime()))return{y:dt.getFullYear(),m:dt.getMonth()+1,d:dt.getDate()};return null;}
function fmtD(s){const p=parseISO(s);return p?p.d+' '+MS[p.m-1]:'';}
function fmtR(a,b){const pa=parseISO(a);if(!pa)return'';const pb=parseISO(b);if(!pb||(pa.y===pb.y&&pa.m===pb.m&&pa.d===pb.d))return fmtD(a);if(pa.y===pb.y&&pa.m===pb.m)return pa.d+'–'+pb.d+' '+MS[pa.m-1];return fmtD(a)+' – '+fmtD(b);}
function flash(m){state.toast=m;render();setTimeout(()=>{state.toast='';render();},2800);}

// === API ===
async function fetchData(){
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),15000);
    const r=await fetch(CONFIG.API_URL+'?t='+Date.now(),{signal:controller.signal});
    clearTimeout(timer);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const txt=await r.text();
    let d;
    try{d=JSON.parse(txt);}
    catch(e){throw new Error('Respuesta no es JSON. Inicio: '+txt.slice(0,120));}
    if(d.error)throw new Error(d.error);
    state.locations=d.locations||[];
    // Normalizar claves de days (workaround del bug del Apps Script con instanceof Date)
    const normDays={};
    for(const k in (d.days||{})){
      const nk=normalizeDateStr(k);
      // Si hay duplicados con misma fecha normalizada, hacer merge de los arrays
      if(normDays[nk]){
        const a=Array.isArray(normDays[nk])?normDays[nk]:[normDays[nk]];
        const b=Array.isArray(d.days[k])?d.days[k]:[d.days[k]];
        b.forEach(x=>{if(!a.includes(x))a.push(x);});
        normDays[nk]=a;
      }else{
        normDays[nk]=d.days[k];
      }
    }
    state.days=normDays;
    state.events=(d.events||[]).map(e=>({...e,date:normalizeDateStr(e.date)}));
    state.requests=(d.requests||[]).map(r=>({...r,dateFrom:normalizeDateStr(r.dateFrom),dateTo:normalizeDateStr(r.dateTo)}));
    state.polls=d.polls||[];
    state.lastError=null;
    console.log('[calendario] cargado:',
      state.locations.length+' destinos,',
      Object.keys(state.days).length+' días marcados,',
      state.events.length+' eventos,',
      state.requests.length+' solicitudes,',
      state.polls.length+' alternativas');
  }catch(e){
    const msg=e.name==='AbortError'?'Tiempo de espera agotado. El Apps Script no responde.':e.message;
    state.lastError=msg;
    console.error('fetchData error:',e);
    flash('❌ '+msg);
  }
}
async function post(payload){
  state.saving=true;render();
  try{
    const r=await fetch(CONFIG.API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    const txt=await r.text();
    let d;
    try{d=JSON.parse(txt);}catch(e){throw new Error('Respuesta no es JSON: '+txt.slice(0,120));}
    if(d.error)throw new Error(d.error);
    return d;
  }catch(e){
    console.error('post error:',e,'payload:',payload);
    flash('❌ Error al guardar: '+e.message);
  }
  finally{state.saving=false;render();}
}
const postPublic=post;

// === Acciones ===
async function toggleDayLocation(date,locId){
  let cur=state.days[date]||[];
  if(!Array.isArray(cur))cur=[cur];
  if(cur.includes(locId)){cur=cur.filter(id=>id!==locId);}
  else{if(cur.length<2)cur.push(locId);}
  if(cur.length===0)delete state.days[date];
  else state.days[date]=cur;
  render();
  await post({action:'setDayMultiple',date,locationIds:cur});
}
async function clearDay(date){
  delete state.days[date];render();
  await post({action:'setDayMultiple',date,locationIds:[]});
}
async function addEvent(date,title,time,locId){if(!title.trim())return;const ev={id:uid(),date,title:title.trim(),time:time||'',locationId:locId||''};state.events.push(ev);render();await post({action:'addEvent',...ev});}
async function delEvent(id){if(!confirm('Eliminar este evento?'))return;state.events=state.events.filter(e=>e.id!==id);render();await post({action:'delEvent',id});}
async function saveEvent(id,title,time,locId){const ev=state.events.find(e=>e.id===id);if(!ev)return;ev.title=title;ev.time=time;ev.locationId=locId;state.editingEvent=null;render();await post({action:'delEvent',id});await post({action:'addEvent',...ev});}
async function addLocation(name,color){if(!name.trim())return;const id=name.trim().toLowerCase().replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-');if(state.locations.find(l=>l.id===id)){flash('Ya existe.');return;}const loc={id,name:name.trim(),color};state.locations.push(loc);render();await post({action:'addLocation',...loc});}
async function updateLocation(id,name,color){const loc=state.locations.find(l=>l.id===id);if(!loc)return;if(name!==undefined)loc.name=name;if(color!==undefined)loc.color=color;render();await post({action:'updateLocation',id,name:loc.name,color:loc.color});}
async function removeLocation(id){
  if(!confirm('Eliminar destino y datos asociados?'))return;
  state.locations=state.locations.filter(l=>l.id!==id);
  Object.keys(state.days).forEach(d=>{
    let cur=state.days[d];
    if(Array.isArray(cur)){state.days[d]=cur.filter(x=>x!==id);if(state.days[d].length===0)delete state.days[d];}
    else if(cur===id)delete state.days[d];
  });
  state.events=state.events.filter(e=>e.locationId!==id);
  render();await post({action:'removeLocation',id});
}

// Solicitudes
async function submitRequest(dateFrom,dateTo,note){if(!dateFrom){flash('Pon fecha de inicio.');return;}const req={id:uid(),dateFrom,dateTo:dateTo||dateFrom,note:note||''};state.requests.push({...req,status:'pendiente'});state.showRequestForm=false;render();await postPublic({action:'requestDays',...req});flash('Solicitud enviada.');}
async function updateRequestStatus(id,status,mensaje){const r=state.requests.find(x=>x.id===id);if(r){r.status=status;if(mensaje)r.mensaje=mensaje;}render();await post({action:'updateRequest',id,status,mensaje:mensaje||''});}

const MENSAJES_APROBACION=[
  '🎉 ¡Concedido! Allá voy... por esta vez 😏',
  '✅ ¡Aprobada la visita! Ya sabes que me debes algo 😘',
  '🥳 ¡Voy a verte! No la líes antes de que llegue 👀',
  '💌 ¡Petición aceptada! Maletas a la vista 🧳',
  '🎊 Ini manda, tú esperas... por esta vez 👑',
  '🌟 ¡Sí! Te quiero mucho, pero no te lo creas 🙈',
  '🏡 ¡Voy cuando quieras! (cuando yo quiera, claro) 😂',
];

function acceptRequest(id){state.acceptingRequest=id;render();}

async function confirmAccept(id,destId){
  const r=state.requests.find(x=>x.id===id);
  if(!r)return;
  const msg=MENSAJES_APROBACION[Math.floor(Math.random()*MENSAJES_APROBACION.length)];
  await updateRequestStatus(id,'aceptada',msg);
  state.acceptingRequest=null;
  if(destId){
    // Mark days range with selected destination
    const ids=[destId];
    // Optimistic update local state
    const d=new Date(r.dateFrom+'T00:00:00Z'),end=new Date(r.dateTo+'T00:00:00Z');
    const cur=new Date(d);
    while(cur<=end){
      const ds=iso(cur);
      let existing=state.days[ds]||[];
      if(!Array.isArray(existing))existing=[existing];
      if(!existing.includes(destId)){existing=[...existing,destId];}
      state.days[ds]=existing;
      cur.setUTCDate(cur.getUTCDate()+1);
    }
    render();
    await post({action:'markDaysRange',dateFrom:r.dateFrom,dateTo:r.dateTo,locationIds:ids});
  }
  flash('✅ Solicitud aceptada y días marcados.');
  syncSilent();
}

async function runDiagnostic(){
  state.showDebug=true;
  state.debugOutput='Probando conexión...';
  render();
  let out='';
  out+='URL del Apps Script:\n'+CONFIG.API_URL+'\n\n';
  out+='Estado en memoria:\n';
  out+='  destinos: '+state.locations.length+'\n';
  out+='  días marcados: '+Object.keys(state.days).length+'\n';
  out+='  eventos: '+state.events.length+'\n';
  out+='  solicitudes: '+state.requests.length+'\n';
  out+='  alternativas: '+state.polls.length+'\n';
  if(state.lastError)out+='\nÚltimo error: '+state.lastError+'\n';
  out+='\n--- Probando GET ---\n';
  try{
    const t0=Date.now();
    const r=await fetch(CONFIG.API_URL+'?t='+Date.now());
    const ms=Date.now()-t0;
    const txt=await r.text();
    out+='Status HTTP: '+r.status+'\n';
    out+='Tiempo: '+ms+'ms\n';
    out+='Tipo de respuesta: '+(r.headers.get('content-type')||'?')+'\n';
    out+='Tamaño: '+txt.length+' chars\n\n';
    out+='Respuesta (primeros 800 chars):\n'+txt.slice(0,800);
    try{
      const d=JSON.parse(txt);
      out+='\n\n✅ JSON válido. Contiene:\n';
      out+='  locations: '+(d.locations?d.locations.length:'NO')+'\n';
      out+='  days: '+(d.days?Object.keys(d.days).length:'NO')+'\n';
      out+='  events: '+(d.events?d.events.length:'NO')+'\n';
      out+='  requests: '+(d.requests?d.requests.length:'NO')+'\n';
      out+='  polls: '+(d.polls?d.polls.length:'NO')+'\n';
      if(d.error)out+='\n⚠️ El servidor devolvió error: '+d.error;
    }catch(e){
      out+='\n\n❌ No es JSON válido. Probablemente la URL devuelve HTML (login de Google o error).';
    }
  }catch(e){
    out+='❌ Fallo de red: '+e.message;
  }
  state.debugOutput=out;

}

// Marcar rango de días
function toggleRangeMark(){state.showRangeMark=!state.showRangeMark;render();}
async function applyRange(){
  const from=$('#rng-from')?.value, to=$('#rng-to')?.value, loc=state.rangeLoc, replace=state.rangeReplace;
  if(!from||!to){flash('Pon fechas desde y hasta.');return;}
  if(!loc){flash('Elige un destino.');return;}
  if(from>to){flash('La fecha de inicio debe ser anterior a la final.');return;}
  // Lista de días en el rango
  const days=[];const start=new Date(from+'T00:00:00');const end=new Date(to+'T00:00:00');
  for(let cur=new Date(start);cur<=end;cur.setDate(cur.getDate()+1))days.push(iso(cur));
  // Actualización optimista
  days.forEach(ds=>{
    if(replace){state.days[ds]=[loc];return;}
    let existing=state.days[ds]||[];if(!Array.isArray(existing))existing=[existing];
    if(!existing.includes(loc)&&existing.length<2)existing.push(loc);
    state.days[ds]=existing;
  });
  state.showRangeMark=false;state.rangeLoc='';state.rangeReplace=false;
  render();
  if(replace){
    // Sobrescribir: una llamada por día (para reemplazar contenidos previos)
    for(const ds of days){await post({action:'setDayMultiple',date:ds,locationIds:[loc]});}
  }else{
    await post({action:'markDaysRange',dateFrom:from,dateTo:to,locationIds:[loc]});
  }
  flash('Rango marcado ('+days.length+' días).');
  syncSilent();
}

forMe.forEach(p=>{h+='<div class="req-card">';if(p.note)h+='<div class="req-note" style="margin-bottom:6px">'+p.note+'</div>';
if(p.status==='pendiente'){p.options.forEach(o=>{h+='<div class="poll-opt">'+formatOption(o)+'</div>';});h+='<button class="btn-accept" style="margin-top:8px;width:100%" onclick="startVoting(\''+p.id+'\')">Ordenar preferencias</button>';}
else{h+='<span class="req-status" style="background:#b8e8c0;color:#1a6b2d">votada</span>';if(p.ranking){h+='<div style="margin-top:8px">';p.ranking.forEach((idx,pos)=>{h+='<div class="poll-opt"><span class="poll-rank">'+(pos+1)+'</span>'+formatOption(p.options[idx])+'</div>';});h+='</div>';}}
h+='</div>';});}
if(mine.length>0){h+='<p style="font-size:13px;font-weight:600;margin:14px 0 8px">Mis alternativas</p>';
mine.forEach(p=>{const sc={pendiente:'background:#fde2a7;color:#7c5e00',votada:'background:#b8e8c0;color:#1a6b2d'};
h+='<div class="req-card">';if(p.note)h+='<div class="req-note" style="margin-bottom:6px">'+p.note+'</div>';
h+='<span class="req-status" style="'+(sc[p.status]||'')+'">'+p.status+'</span>';
if(p.status==='votada'&&p.ranking){h+='<div style="margin-top:8px">';p.ranking.forEach((idx,pos)=>{h+='<div class="poll-opt"><span class="poll-rank">'+(pos+1)+'</span>'+formatOption(p.options[idx])+'</div>';});h+='</div>';}
else{p.options.forEach(o=>{h+='<div class="poll-opt">'+formatOption(o)+'</div>';});}
h+='<button class="btn-dismiss" style="margin-top:8px" onclick="deletePoll(\''+p.id+'\')">Eliminar</button></div>';});}
if(mine.length===0&&forMe.length===0)h+='<p class="empty">No hay alternativas.</p>';
h+='</div></div>';}

// Poll form
if(state.showPollForm){const lo=state.locations.map(l=>'<option value="'+l.id+'">'+l.name+'</option>').join('');
h+=`<div class="overlay" onclick="togglePollForm()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="sheet-title">Nueva alternativa</div><button class="close" onclick="togglePollForm()">&times;</button></div>
<p style="font-size:13px;color:var(--muted);margin-bottom:12px">Cada opcion puede tener varios tramos.</p>`;
state.pollOptions.forEach((opt,i)=>{
h+=`<div class="opt-block"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:13px;font-weight:700">Opcion ${i+1}</span>${state.pollOptions.length>1?'<button class="ev-del" onclick="removePollOption('+i+')">quitar</button>':''}</div>`;
opt.legs.forEach((lg,j)=>{
h+=`<div class="leg-row"><input type="date" value="${lg.from}" onchange="updatePollLeg(${i},${j},'from',this.value)" style="font-size:13px;border:1px solid var(--border);border-radius:8px;padding:7px;background:var(--card);flex:1"><input type="date" value="${lg.to}" onchange="updatePollLeg(${i},${j},'to',this.value)" style="font-size:13px;border:1px solid var(--border);border-radius:8px;padding:7px;background:var(--card);flex:1"><select onchange="updatePollLeg(${i},${j},'loc',this.value)" style="font-size:13px;border:1px solid var(--border);border-radius:8px;padding:7px;background:var(--card)"><option value="">Destino</option>${lo.replace('value="'+lg.loc+'"','value="'+lg.loc+'" selected')}</select>${opt.legs.length>1?'<button class="ev-del" onclick="removePollLeg('+i+','+j+')">x</button>':''}</div>`;});
h+=`<button class="btn" style="font-size:12px;padding:6px 10px;margin-bottom:4px" onclick="addPollLeg(${i})">+ tramo</button></div>`;});
h+=`<button class="btn" style="width:100%;margin-bottom:10px" onclick="addPollOption()">+ Otra opcion</button>
<div class="req-form-row"><label>Nota</label><input type="text" id="poll-note" placeholder="Opcional"></div>
<button class="btn btn-dark" style="width:100%;padding:12px" onclick="submitPoll($('#poll-note')?.value)">Enviar alternativa</button></div></div>`;}

// Voting
if(state.votingPoll){const poll=state.polls.find(p=>p.id===state.votingPoll);
if(poll){h+=`<div class="overlay" onclick="state.votingPoll=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="sheet-title">Ordena de mejor a peor</div><button class="close" onclick="state.votingPoll=null;render()">&times;</button></div>`;
if(poll.note)h+='<div class="req-note" style="margin-bottom:12px">'+poll.note+'</div>';
state.voteOrder.forEach((oi,pos)=>{h+=`<div class="vote-item"><span class="poll-rank">${pos+1}</span><span style="flex:1;font-size:14px">${formatOption(poll.options[oi])}</span><button class="vote-arrow" onclick="moveVote(${pos},-1)" ${pos===0?'disabled':''}>&blacktriangle;</button><button class="vote-arrow" onclick="moveVote(${pos},1)" ${pos===state.voteOrder.length-1?'disabled':''}>&blacktriangledown;</button></div>`;});
h+=`<button class="btn btn-dark" style="width:100%;margin-top:12px;padding:12px" onclick="submitVote('${poll.id}')">Enviar voto</button></div></div>`;}}

// Diagnóstico
if(state.showDebug){
h+=`<div class="overlay" onclick="state.showDebug=false;render()"><div class="sheet" onclick="event.stopPropagation()" style="max-width:640px"><div class="sheet-head"><div class="sheet-title">🔧 Diagnóstico</div><button class="close" onclick="state.showDebug=false;render()">&times;</button></div>
<pre style="font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#1e1a16;color:#e8e2d6;padding:14px;border-radius:10px;overflow:auto;max-height:60vh;white-space:pre-wrap;word-break:break-all;line-height:1.5">${(state.debugOutput||'(sin datos)').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn" style="flex:1" onclick="navigator.clipboard.writeText(state.debugOutput).then(()=>flash('Copiado.'))">📋 Copiar</button>
<button class="btn btn-dark" style="flex:1" onclick="runDiagnostic()">🔄 Volver a probar</button>
</div>
</div></div>`;}

// Marcar rango
if(state.showRangeMark&&isEditor){
h+=`<div class="overlay" onclick="toggleRangeMark()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="sheet-title">Marcar varios días</div><button class="close" onclick="toggleRangeMark()">&times;</button></div>
<p style="font-size:13px;color:var(--muted);margin-bottom:12px">Pinta un rango de días seguidos con un destino.</p>
<div class="req-form-row"><label>Desde</label><input type="date" id="rng-from"></div>
<div class="req-form-row"><label>Hasta</label><input type="date" id="rng-to"></div>
<p style="font-size:13px;font-weight:600;margin:10px 0 6px">Destino</p>
<div class="place-row">`;
state.locations.forEach(l=>{
  const act=state.rangeLoc===l.id;
  h+=`<button class="place-btn${act?' active':''}" style="background:${act?darken(l.color,.15):l.color};color:${act?'#fff':darken(l.color)};${act?'border-color:'+darken(l.color):''}" onclick="state.rangeLoc='${l.id}';render()">${l.name}</button>`;
});
h+=`</div>
<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:10px 0 14px;cursor:pointer">
  <input type="checkbox" ${state.rangeReplace?'checked':''} onchange="state.rangeReplace=this.checked">
  Sobrescribir días que ya tengan otro destino
</label>
<button class="btn btn-dark" style="width:100%;padding:12px" onclick="applyRange()">Aplicar</button>
</div></div>`;}


if(state.colorPicker){h+=`<div class="color-picker" id="cpicker" style="top:${state.colorPicker.y}px;left:${state.colorPicker.x}px">`;
PASTELS.forEach(c=>{h+=`<span class="color-opt${state.colorPicker.current===c?' sel':''}" style="background:${c}" onclick="pickColor('${state.colorPicker.locId}','${c}')"></span>`;});
h+=`<div class="color-custom-row"><input type="color" value="${state.colorPicker.current||'#a7d8c8'}" onchange="pickColor('${state.colorPicker.locId}',this.value)"><span>Personalizado</span></div></div>`;}

// Location manager
if(state.showLocMgr&&isEditor){
h+=`<div class="overlay" onclick="toggleLocMgr()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="sheet-title">Gestionar destinos</div><button class="close" onclick="toggleLocMgr()">&times;</button></div>`;
state.locations.forEach(l=>{h+=`<div class="loc-item" style="position:relative"><span class="swatch" style="background:${l.color}" onclick="openColorPicker('${l.id}',this)" title="Cambiar color"></span><input type="text" value="${l.name}" onchange="updateLocation('${l.id}',this.value,undefined)"><button class="ev-del" onclick="removeLocation('${l.id}')">eliminar</button></div>`;});
h+=`<div class="add-loc-row"><input type="text" id="new-loc-name" placeholder="Nuevo destino..." style="flex:1;font-size:14px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--card)"><button class="btn btn-dark" onclick="submitNewLoc()">Anadir</button></div></div></div>`;}

if(state.saving)h+='<div class="saving">Guardando...</div>';
if(state.toast)h+=`<div class="toast">${state.toast}</div>`;
app.innerHTML=h;
}

function move(n){state.cursor=new Date(state.cursor.getFullYear(),state.cursor.getMonth()+n,1);render();}
function goToday(){const t=new Date();state.cursor=new Date(t.getFullYear(),t.getMonth(),1);render();}
function jumpTo(y,m,date){state.cursor=new Date(y,m,1);state.selected=date;render();}
function selectDay(d){state.selected=d;state.colorPicker=null;state.editingEvent=null;render();}
function closeDay(){state.selected=null;state.editingEvent=null;render();}
function toggleLocMgr(){state.showLocMgr=!state.showLocMgr;state.colorPicker=null;render();}
function toggleRequestForm(){state.showRequestForm=!state.showRequestForm;render();}
function toggleRequests(){state.showRequests=!state.showRequests;render();}
function togglePolls(){state.showPolls=!state.showPolls;render();}
function togglePollForm(){state.showPollForm=!state.showPollForm;if(state.showPollForm)state.showPolls=false;render();}
function submitEvent(date){const t=$('#ev-title')?.value,ti=$('#ev-time')?.value,l=$('#ev-loc')?.value;addEvent(date,t,ti,l);}
function submitNewLoc(){const n=$('#new-loc-name')?.value;if(!n?.trim())return;addLocation(n,PASTELS[state.locations.length%PASTELS.length]);}
function openColorPicker(locId,el){const r=el.getBoundingClientRect();const loc=state.locations.find(l=>l.id===locId);state.colorPicker={locId,x:r.left,y:r.bottom+6,current:loc?.color};render();}
function pickColor(locId,color){updateLocation(locId,undefined,color);state.colorPicker=null;render();}
document.addEventListener('click',e=>{if(state.colorPicker&&!e.target.closest('.color-picker')&&!e.target.closest('.swatch')){state.colorPicker=null;render();}});

(async()=>{
  render(); // mostrar calendario vacío inmediatamente
  await fetchData();
  render(); // actualizar con datos del servidor
})();
</script>
</body>
</html>
